name: "0 - Setup Unity license"

# One-time step. Downloads the Unity manual activation file (.alf).
# You upload it at license.unity3d.com, get a .ulf back, then add it
# as the UNITY_LICENSE repo secret (see README).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  request-activation:
    runs-on: ubuntu-latest
    steps:
      - name: Request activation file
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload activation file artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_Activation_alf
          path: Unity_*.alf
